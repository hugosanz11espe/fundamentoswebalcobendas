<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function ejecutarBucleFor() {
            //SE INICIA EN UN NUMERO Y DEBEMOS INDICAR HASTA QUE 
            //NUMERO FINALIZA Y CUANTO SUMA
            //inicio = 4, hasta 8 (mientras), de uno en uno
            let texto = "";
            for (let i = 1; i <= 8; i++){
                //guardamos en la variable texto el valor de i: 1, 2, 3, 4...
                texto += i + ", ";
            }
            //recuperamos resultado
            let resultado = document.getElementById("resultado");
            resultado.innerText = texto;
        }
    </script>
</head>
<body>
    <h1>Sintaxis de bucles</h1>
    <button>Ejecutar for</button>
    <p id="resultado"></p>
</body>
</html>
