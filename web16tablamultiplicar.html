<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla de multiplicar del 9</title>
    <script>
        //necesito que me hagas una lista de la tabla de multiplicar del numero 9
        function generarTabla() {
            let tabla = document.getElementById("tablamultiplicar");
            //recuperamos la caja de texto numero
            let numero = document.getElementById("numero").value;
            let numero = parseInt(numero.value);
            let contenido = "";
            let numero = 9; 
            for (let i = 1; i <= 10; i++) {
                let resultado = numero * i;
                contenido += "<li>" + numero + " x "+ i + " = " + (numero * i) + "</li>";
            }
            tabla.innerHTML = contenido;
        }
    </script>
            
</head>
<body>
    <h1>tabla multiplicar</h1>
    Introduzca un numero <input type=" number" id="numero"/>
    <button onclick="generarTabla ()">
        mostrar tabla
    </button>
    <ul  id="tablamultiplicar">

    </ul>
</body>
</html>
