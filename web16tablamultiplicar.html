<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function mostrarTabla() {
            //recuperamos la lista de numeros para el dibujo
            let listanumeros = document.getElementById("listanumeros");
            //creamos el contenido para el dibujo
            let contenido = "";
            //necesitamos la tabla de multiplicar del número 9 (1--10)
            for (let i = 1; i <= 10; i++){
                let operacion = 9 * i;
                contenido += "<li>" + operacion + "</li>";
            }
            //dibujamos en la lista inferior
            listanumeros.innerHTML = contenido;
        }
    </script>
</head>
<body>
    <h1>Tabla multiplicar</h1>
    <button onclick="mostrarTabla()">Mostrar tabla</button>
    <ul id="listanumeros">

    </ul>
</body>
</html>
